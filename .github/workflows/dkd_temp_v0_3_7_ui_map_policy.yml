name: DraBornGate v0.3.7 Typecheck Debug

on:
  push:
    branches: [work/draborngate-v0.3.7-ui-map-policy-fixes]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-v0-3-7-typecheck-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4
        with:
          ref: work/draborngate-v0.3.7-ui-map-policy-fixes
          fetch-depth: 1
          show-progress: false

      - name: Düzeltme paketini uygula
        shell: bash
        run: |
          set -euo pipefail
          cat .dkd_payload/part_* | base64 --decode > /tmp/dkd-source.tar.gz
          gzip -t /tmp/dkd-source.tar.gz
          tar --no-same-owner -xzf /tmp/dkd-source.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları sessiz kur
        shell: bash
        run: npm install --no-audit --no-fund >/tmp/dkd-npm-install.log 2>&1

      - name: TypeScript raporunu hazırla
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck > dkd_typecheck_v0_3_7.log 2>&1

      - name: TypeScript raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-v0.3.7-Typecheck-Debug
          path: dkd_typecheck_v0_3_7.log
          if-no-files-found: error
          retention-days: 3

      - name: TypeScript sonucunu zorunlu tut
        if: always()
        shell: bash
        run: test "${{ steps.typecheck.outcome }}" = "success"
