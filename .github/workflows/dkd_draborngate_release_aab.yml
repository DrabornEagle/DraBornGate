name: DraBornGate Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dkd_release/trigger_aab_v0313.txt

permissions:
  contents: write
  id-token: write

concurrency:
  group: draborngate-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CI: "1"
      DKD_RELEASE_VAULT_URL: https://guuwomvszlwhkmstewfl.supabase.co/functions/v1/dkd-gate-release-vault
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Run kimliğini ve workflow envanterini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow=DraBornGate Release AAB"
            echo "version=0.3.13"
            echo "android_version_code=3"
          } > .dkd_release/latest_aab_run.txt
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > .dkd_release/workflow_inventory.txt
          test "$(wc -l < .dkd_release/workflow_inventory.txt)" -eq 2
          grep -Fx 'dkd_draborngate_release_apk.yml' .dkd_release/workflow_inventory.txt
          grep -Fx 'dkd_draborngate_release_aab.yml' .dkd_release/workflow_inventory.txt
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .dkd_release/latest_aab_run.txt .dkd_release/workflow_inventory.txt
          git commit -m "ci: v0.3.13 AAB run $GITHUB_RUN_ID kaydını güncelle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sürümü doğrula
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p 'require("./package.json").version')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          test "$APP_VERSION" = "0.3.13"
          test "$(node -p 'require("./app.json").expo.android.versionCode')" = "3"

      - name: GitHub OIDC release kimliğini al
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Bağımlılıkları ve kaynak kodunu doğrula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release
          LOG=".dkd_release/dkd_v0313_validation_latest.txt"
          npm install --no-audit --no-fund --package-lock=false 2>&1 | tee "$LOG"
          npm run typecheck 2>&1 | tee -a "$LOG"
          bash scripts/dkd_google_play_policy_gate.sh 2>&1 | tee -a "$LOG"

      - name: Android release projesini üret
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ env.GOOGLE_MAPS_ANDROID_API_KEY || 'dkd_release_placeholder_key' }}
        run: npx expo prebuild --clean --platform android

      - name: Kalıcı DraBornGate keystore'unu özel kasadan al
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle" signing-work
          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
          METADATA="signing-work/signing.json"
          KEYSTORE="android/app/draborngate-release.keystore"
          curl --fail --show-error --location --retry 6 --retry-all-errors --retry-delay 3 --max-time 90 -H "$AUTH_HEADER" "$DKD_RELEASE_VAULT_URL/signing/metadata" -o "$METADATA"
          curl --fail --show-error --location --retry 6 --retry-all-errors --retry-delay 3 --max-time 90 -H "$AUTH_HEADER" "$DKD_RELEASE_VAULT_URL/signing/keystore" -o "$KEYSTORE"
          STORE_PASSWORD="$(jq -r '.storePassword' "$METADATA")"
          KEY_PASSWORD="$(jq -r '.keyPassword // .storePassword' "$METADATA")"
          KEY_ALIAS="$(jq -r '.alias' "$METADATA")"
          test -s "$KEYSTORE"
          test -n "$STORE_PASSWORD" && test "$STORE_PASSWORD" != "null"
          test -n "$KEY_PASSWORD" && test "$KEY_PASSWORD" != "null"
          test -n "$KEY_ALIAS" && test "$KEY_ALIAS" != "null"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          cat >> "$HOME/.gradle/gradle.properties" <<EOF_GRADLE
          DKD_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/$KEYSTORE
          DKD_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
          DKD_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          DKD_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF_GRADLE
          cat >> android/app/build.gradle <<'EOF_SIGNING'

          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file(findProperty('DKD_UPLOAD_STORE_FILE'))
                      storePassword findProperty('DKD_UPLOAD_STORE_PASSWORD')
                      keyAlias findProperty('DKD_UPLOAD_KEY_ALIAS')
                      keyPassword findProperty('DKD_UPLOAD_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dkdRelease
                  }
              }
          }
          EOF_SIGNING

      - name: Release AAB ve politika kontrol APK'sini oluştur
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee "../dkd_gradle_aab_v${APP_VERSION}.log"

      - name: AAB'yi hazırla ve Google Play politikasını doğrula
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/bundle/release/app-release.aab "DraBornGate-v${APP_VERSION}-release.aab"
          bash scripts/dkd_google_play_policy_gate.sh android/app/build/outputs/apk/release/app-release.apk | tee "dkd_google_play_policy_v${APP_VERSION}.txt"

      - name: AAB imzasını kalıcı keystore ile doğrula
        shell: bash
        run: |
          set -euo pipefail
          AAB="DraBornGate-v${APP_VERSION}-release.aab"
          REPORT="dkd_aab_signature_v${APP_VERSION}.txt"
          jarsigner -verify -verbose -certs "$AAB" | tee "$REPORT"
          keytool -printcert -jarfile "$AAB" > signing-work/aab-cert.txt
          keytool -list -v -keystore android/app/draborngate-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > signing-work/keytool.txt
          AAB_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' signing-work/aab-cert.txt | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          KEY_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' signing-work/keytool.txt | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          AAB_SHA256="$(sha256sum "$AAB" | awk '{print $1}')"
          test -n "$AAB_CERT" && test "$AAB_CERT" = "$KEY_CERT"
          {
            echo
            echo "AAB sertifika SHA-256: $AAB_CERT"
            echo "Kalıcı keystore sertifika SHA-256: $KEY_CERT"
            echo "AAB dosya SHA-256: $AAB_SHA256"
          } | tee -a "$REPORT"

      - name: AAB'yi imzalı doğrudan URL ile Supabase Storage'a yükle
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
          AAB="DraBornGate-v${APP_VERSION}-release.aab"
          SIGNED_JSON="$(curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -H "$AUTH_HEADER" "$DKD_RELEASE_VAULT_URL/release/aab-upload-url?version=${APP_VERSION}")"
          SIGNED_URL="$(printf '%s' "$SIGNED_JSON" | jq -r '.signedUrl')"
          test -n "$SIGNED_URL" && test "$SIGNED_URL" != "null"
          curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 600 -X PUT -H "Content-Type: application/octet-stream" --data-binary "@$AAB" "$SIGNED_URL"

      - name: DraBornGate Release AAB yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Release-AAB-v${{ env.APP_VERSION }}
          path: |
            DraBornGate-v${{ env.APP_VERSION }}-release.aab
            dkd_gradle_aab_v${{ env.APP_VERSION }}.log
            dkd_aab_signature_v${{ env.APP_VERSION }}.txt
            dkd_google_play_policy_v${{ env.APP_VERSION }}.txt
            signing-work/aab-cert.txt
            signing-work/keytool.txt
            .dkd_release/dkd_v0313_validation_latest.txt
          if-no-files-found: error
          retention-days: 30
