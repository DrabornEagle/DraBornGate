name: DraBornGate Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dkd_release/trigger_aab_v0313.txt

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: draborngate-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DKD_RELEASE_VAULT_URL: https://guuwomvszlwhkmstewfl.supabase.co/functions/v1/dkd-gate-release-vault
      DKD_SOURCE_RUN_ID: "30279086956"
      APP_VERSION: "0.3.13"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: GitHub OIDC release kimliğini al
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: İmzalı v0.3.13 AAB artifactini al
        uses: actions/download-artifact@v4
        with:
          name: DraBornGate-Release-AAB-v0.3.13
          path: release-artifact
          github-token: ${{ github.token }}
          repository: DrabornEagle/DraBornGate
          run-id: ${{ env.DKD_SOURCE_RUN_ID }}

      - name: Supabase istemcisini kur
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false @supabase/supabase-js@2.57.4

      - name: AAB'yi Supabase Storage'a imzalı SDK akışıyla yükle
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="$(find release-artifact -type f -name 'DraBornGate-v0.3.13-release.aab' -print -quit)"
          test -n "$AAB_PATH" && test -s "$AAB_PATH"
          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
          curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 \
            -H "$AUTH_HEADER" \
            "$DKD_RELEASE_VAULT_URL/release/aab-upload-url?version=${APP_VERSION}" \
            -o signed-aab-upload.json
          node scripts/dkd_upload_signed_release_aab.js "$AAB_PATH" signed-aab-upload.json | tee dkd_supabase_aab_upload_v0.3.13.txt

      - name: Supabase AAB yükleme raporunu sakla
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Supabase-AAB-Upload-v0.3.13
          path: dkd_supabase_aab_upload_v0.3.13.txt
          if-no-files-found: error
          retention-days: 30
