name: DraBornGate Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dkd_release/trigger_aab_v0313.txt

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: draborngate-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DKD_RELEASE_VAULT_URL: https://guuwomvszlwhkmstewfl.supabase.co/functions/v1/dkd-gate-release-vault
      DKD_SOURCE_RUN_ID: "30279086956"
      APP_VERSION: "0.3.13"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Supabase yükleme run kimliğini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow=DraBornGate Release AAB"
            echo "mode=supabase-upload-only"
            echo "version=0.3.13"
            echo "android_version_code=3"
          } > .dkd_release/latest_aab_run.txt
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .dkd_release/latest_aab_run.txt
          git commit -m "ci: v0.3.13 Supabase AAB upload run $GITHUB_RUN_ID kaydını güncelle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: GitHub OIDC release kimliğini al
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: İmzalı v0.3.13 AAB artifactini al
        uses: actions/download-artifact@v4
        with:
          name: DraBornGate-Release-AAB-v0.3.13
          path: release-artifact
          github-token: ${{ github.token }}
          repository: DrabornEagle/DraBornGate
          run-id: ${{ env.DKD_SOURCE_RUN_ID }}

      - name: Supabase istemcisini kur
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false @supabase/supabase-js@2.57.4

      - name: AAB'yi Supabase Storage'a imzalı SDK akışıyla yükle
        shell: bash
        run: |
          set +e
          mkdir -p .dkd_release
          REPORT=".dkd_release/dkd_supabase_aab_upload_latest.txt"
          : > "$REPORT"
          AAB_PATH="$(find release-artifact -type f -name 'DraBornGate-v0.3.13-release.aab' -print -quit)"
          if [ -z "$AAB_PATH" ] || [ ! -s "$AAB_PATH" ]; then
            echo "AAB artifact içinde bulunamadı." | tee -a "$REPORT"
            STATUS=40
          else
            AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
            curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 \
              -H "$AUTH_HEADER" \
              "$DKD_RELEASE_VAULT_URL/release/aab-upload-url?version=${APP_VERSION}" \
              -o signed-aab-upload.json 2>&1 | tee -a "$REPORT"
            CURL_STATUS=${PIPESTATUS[0]}
            if [ "$CURL_STATUS" -eq 0 ]; then
              node scripts/dkd_upload_signed_release_aab.js "$AAB_PATH" signed-aab-upload.json 2>&1 | tee -a "$REPORT"
              STATUS=${PIPESTATUS[0]}
            else
              STATUS="$CURL_STATUS"
            fi
          fi
          {
            echo "status=$STATUS"
            echo "run_id=$GITHUB_RUN_ID"
          } | tee -a "$REPORT"
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "ci: v0.3.13 Supabase AAB upload sonucunu kaydet $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          exit "$STATUS"

      - name: Supabase AAB yükleme raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Supabase-AAB-Upload-v0.3.13
          path: .dkd_release/dkd_supabase_aab_upload_latest.txt
          if-no-files-found: error
          retention-days: 30
