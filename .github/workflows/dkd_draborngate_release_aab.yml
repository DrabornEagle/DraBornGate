name: DraBornGate Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .dkd_release/trigger_aab_v0316.txt

permissions:
  contents: write
  id-token: write

concurrency:
  group: draborngate-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      DKD_RELEASE_VAULT_URL: https://guuwomvszlwhkmstewfl.supabase.co/functions/v1/dkd-gate-release-vault
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Run kimliğini ve workflow envanterini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow=DraBornGate Release AAB"
            echo "version=0.3.16"
            echo "android_version_code=6"
          } > .dkd_release/latest_aab_run.txt
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > .dkd_release/workflow_inventory.txt
          test "$(wc -l < .dkd_release/workflow_inventory.txt)" -eq 2
          grep -Fx 'dkd_draborngate_release_apk.yml' .dkd_release/workflow_inventory.txt
          grep -Fx 'dkd_draborngate_release_aab.yml' .dkd_release/workflow_inventory.txt
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .dkd_release/latest_aab_run.txt .dkd_release/workflow_inventory.txt
          git commit -m "ci: v0.3.16 AAB run $GITHUB_RUN_ID kaydını güncelle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: v0.3.16 kaynak yükseltmesini uygula ve GitHub'a kaydet
        shell: bash
        run: |
          set -euo pipefail
          node scripts/dkd_apply_v0316.js
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/screens/AuthScreen.tsx \
            src/screens/CourierHome.tsx \
            src/screens/CourierCenterV032.tsx \
            src/screens/ResidentHome.tsx \
            src/components/GooglePlaySubscriptionButton.tsx \
            scripts/dkd_google_play_policy_gate.sh
          if ! git diff --cached --quiet; then
            git commit -m "feat: DraBornGate v0.3.16 arayüz ve politika düzenlemeleri"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sürümü doğrula
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p 'require("./package.json").version')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          test "$APP_VERSION" = "0.3.16"
          test "$(node -p 'require("./app.json").expo.android.versionCode')" = "6"
          test "$(node -p 'require("./app.json").expo.android.package')" = "com.draborneagle.draborngate"
          node scripts/dkd_verify_v0316.js

      - name: GitHub OIDC release kimliğini al
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Bağımlılıkları, TypeScript'i ve politikaları doğrula
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run typecheck
          bash scripts/dkd_google_play_policy_gate.sh

      - name: Android release projesini üret
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ env.GOOGLE_MAPS_ANDROID_API_KEY || 'dkd_release_placeholder_key' }}
        run: npx expo prebuild --clean --platform android

      - name: Kalıcı DraBornGate keystore'unu özel kasadan al
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle" signing-work
          METADATA="signing-work/signing.json"
          KEYSTORE="android/app/draborngate-release.keystore"
          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
          curl -fsSL -H "$AUTH_HEADER" "$DKD_RELEASE_VAULT_URL/signing/metadata" -o "$METADATA"
          curl -fsSL -H "$AUTH_HEADER" "$DKD_RELEASE_VAULT_URL/signing/keystore" -o "$KEYSTORE"
          STORE_PASSWORD="$(jq -r '.storePassword' "$METADATA")"
          KEY_PASSWORD="$(jq -r '.keyPassword // .storePassword' "$METADATA")"
          KEY_ALIAS="$(jq -r '.alias' "$METADATA")"
          test -s "$KEYSTORE"
          test -n "$STORE_PASSWORD" && test "$STORE_PASSWORD" != "null"
          test -n "$KEY_PASSWORD" && test "$KEY_PASSWORD" != "null"
          test -n "$KEY_ALIAS" && test "$KEY_ALIAS" != "null"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          cat >> "$HOME/.gradle/gradle.properties" <<EOF_GRADLE
          DKD_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/$KEYSTORE
          DKD_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
          DKD_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          DKD_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF_GRADLE
          cat >> android/app/build.gradle <<'EOF_SIGNING'

          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file(findProperty('DKD_UPLOAD_STORE_FILE'))
                      storePassword findProperty('DKD_UPLOAD_STORE_PASSWORD')
                      keyAlias findProperty('DKD_UPLOAD_KEY_ALIAS')
                      keyPassword findProperty('DKD_UPLOAD_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dkdRelease
                  }
              }
          }
          EOF_SIGNING

      - name: Release AAB oluştur
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee "../dkd_gradle_aab_v${APP_VERSION}.log"

      - name: AAB'yi hazırla ve imzayı doğrula
        shell: bash
        run: |
          set -euo pipefail
          AAB="DraBornGate-v${APP_VERSION}-release.aab"
          REPORT="dkd_aab_signature_v${APP_VERSION}.txt"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee "$REPORT"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" > signing-work/aab-cert.txt
          keytool -list -v -keystore android/app/draborngate-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > signing-work/keytool.txt
          AAB_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' signing-work/aab-cert.txt | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          KEY_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' signing-work/keytool.txt | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          AAB_SHA256="$(sha256sum "$AAB" | awk '{print $1}')"
          test -n "$AAB_CERT" && test -n "$KEY_CERT"
          test "$AAB_CERT" = "$KEY_CERT"
          {
            echo
            echo "AAB sertifika SHA-256: $AAB_CERT"
            echo "Kalıcı keystore sertifika SHA-256: $KEY_CERT"
            echo "AAB dosya SHA-256: $AAB_SHA256"
            echo "Sürüm: $APP_VERSION"
            echo "Android versionCode: 6"
            echo "Paket: com.draborneagle.draborngate"
          } | tee -a "$REPORT"

      - name: Supabase yüklemesi için OIDC kimliğini yenile
        shell: bash
        run: |
          set -euo pipefail
          FRESH_OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$FRESH_OIDC_TOKEN" && test "$FRESH_OIDC_TOKEN" != "null"
          echo "::add-mask::$FRESH_OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$FRESH_OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: AAB'yi Supabase özel release kasasına parçalı yükle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dkd_upload_aab_chunks.sh \
            "DraBornGate-v${APP_VERSION}-release.aab" \
            "$APP_VERSION" \
            "$DKD_RELEASE_VAULT_URL" \
            "$DKD_RELEASE_OIDC_TOKEN"

      - name: DraBornGate Release AAB yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Release-AAB-v${{ env.APP_VERSION }}
          path: |
            DraBornGate-v${{ env.APP_VERSION }}-release.aab
            dkd_gradle_aab_v${{ env.APP_VERSION }}.log
            dkd_aab_signature_v${{ env.APP_VERSION }}.txt
            dkd_supabase_aab_upload_v${{ env.APP_VERSION }}.txt
            DraBornGate-v${{ env.APP_VERSION }}-release.aab.manifest.json
            aab-chunks-status.json
            signing-work/aab-cert.txt
            signing-work/keytool.txt
          if-no-files-found: error
          retention-days: 30
