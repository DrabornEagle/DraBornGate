name: DraBornGate Release AAB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_draborngate_release_aab.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: draborngate-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: "1"
      ANDROID_KEY_ALIAS: draborngate-upload
      DKD_RELEASE_VAULT_URL: https://guuwomvszlwhkmstewfl.supabase.co/functions/v1/dkd-gate-release-vault
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sürüm ve AAB çalışma kimliğini hazırla
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p 'require("./package.json").version')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          mkdir -p .dkd_release
          cat > .dkd_release/latest_aab_run.json <<EOF_RUN
          {
            "version": "$APP_VERSION",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "source_sha": "${{ github.sha }}",
            "status": "building",
            "artifact_name": "DraBornGate-Release-AAB-v$APP_VERSION"
          }
          EOF_RUN
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .dkd_release/latest_aab_run.json
          git commit -m "ci: v$APP_VERSION AAB çalışma kimliğini kaydet [skip ci]" || true
          git pull --rebase origin main
          git push origin main

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: GitHub OIDC release kimliğini al
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Bağımlılıkları ve TypeScript'i doğrula
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Android release projesini üret
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ env.GOOGLE_MAPS_ANDROID_API_KEY || 'dkd_release_placeholder_key' }}
        run: npx expo prebuild --clean --platform android

      - name: Aynı kalıcı DraBornGate keystore'unu özel kasadan al
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle" signing-work
          METADATA="signing-work/signing.json"
          KEYSTORE="android/app/draborngate-release.keystore"
          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
          curl -fsSL -H "$AUTH_HEADER" "$DKD_RELEASE_VAULT_URL/signing/metadata" -o "$METADATA"
          curl -fsSL -H "$AUTH_HEADER" "$DKD_RELEASE_VAULT_URL/signing/keystore" -o "$KEYSTORE"
          STORE_PASSWORD="$(jq -r '.storePassword' "$METADATA")"
          KEY_PASSWORD="$(jq -r '.keyPassword // .storePassword' "$METADATA")"
          KEY_ALIAS="$(jq -r '.alias' "$METADATA")"
          test -s "$KEYSTORE"
          test -n "$STORE_PASSWORD" && test "$STORE_PASSWORD" != "null"
          test -n "$KEY_PASSWORD" && test "$KEY_PASSWORD" != "null"
          test -n "$KEY_ALIAS" && test "$KEY_ALIAS" != "null"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          cat >> "$HOME/.gradle/gradle.properties" <<EOF_GRADLE
          DKD_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/$KEYSTORE
          DKD_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
          DKD_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          DKD_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF_GRADLE
          cat >> android/app/build.gradle <<'EOF_SIGNING'

          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file(findProperty('DKD_UPLOAD_STORE_FILE'))
                      storePassword findProperty('DKD_UPLOAD_STORE_PASSWORD')
                      keyAlias findProperty('DKD_UPLOAD_KEY_ALIAS')
                      keyPassword findProperty('DKD_UPLOAD_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.dkdRelease
                  }
              }
          }
          EOF_SIGNING
          grep -q "signingConfig signingConfigs.dkdRelease" android/app/build.gradle

      - name: Release AAB oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: AAB adını ve kalıcı imza raporunu hazırla
        id: signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="DraBornGate-v${APP_VERSION}-release.aab"
          REPORT="dkd_aab_signature_v${APP_VERSION}.txt"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee "$REPORT"
          keytool -printcert -jarfile "$AAB" > signing-work/aab-cert.txt
          keytool -list -v -keystore android/app/draborngate-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > signing-work/keytool.txt
          AAB_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' signing-work/aab-cert.txt | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          KEY_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' signing-work/keytool.txt | sed -n '1p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          AAB_SHA256="$(sha256sum "$AAB" | awk '{print $1}')"
          test -n "$AAB_CERT"
          test -n "$KEY_CERT"
          {
            echo
            echo "AAB sertifika SHA-256: $AAB_CERT"
            echo "Kalıcı keystore sertifika SHA-256: $KEY_CERT"
            echo "AAB dosya SHA-256: $AAB_SHA256"
          } | tee -a "$REPORT"
          MATCH=false
          if [ "$AAB_CERT" = "$KEY_CERT" ]; then
            MATCH=true
            echo "Kalıcı DraBornGate imzası eşleşti: $KEY_CERT" | tee -a "$REPORT"
          else
            echo "İmza eşleşmesi başarısız: AAB=$AAB_CERT KEYSTORE=$KEY_CERT" | tee -a "$REPORT"
          fi
          echo "DKD_AAB_CERT_SHA256=$AAB_CERT" >> "$GITHUB_ENV"
          echo "DKD_KEY_CERT_SHA256=$KEY_CERT" >> "$GITHUB_ENV"
          echo "DKD_AAB_SHA256=$AAB_SHA256" >> "$GITHUB_ENV"
          echo "match=$MATCH" >> "$GITHUB_OUTPUT"

      - name: AAB'yi özel Supabase kasasına yedeklemeyi dene
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
          test -s "DraBornGate-v${APP_VERSION}-release.aab" || exit 0
          curl --fail --show-error --max-time 180 -X PUT -H "$AUTH_HEADER" -H "Content-Type: application/octet-stream" --data-binary "@DraBornGate-v${APP_VERSION}-release.aab" "$DKD_RELEASE_VAULT_URL/release/aab?version=${APP_VERSION}"

      - name: DraBornGate Release AAB yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Release-AAB-v${{ env.APP_VERSION }}
          path: |
            DraBornGate-v${{ env.APP_VERSION }}-release.aab
            dkd_aab_signature_v${{ env.APP_VERSION }}.txt
            signing-work/aab-cert.txt
            signing-work/keytool.txt
          if-no-files-found: error
          retention-days: 30

      - name: Başarılı AAB çalışma kaydını güncelle
        if: steps.signature.outputs.match == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > .dkd_release/latest_aab_run.json <<EOF_RUN
          {
            "version": "$APP_VERSION",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "source_sha": "${{ github.sha }}",
            "status": "success",
            "artifact_name": "DraBornGate-Release-AAB-v$APP_VERSION",
            "aab_sha256": "$DKD_AAB_SHA256",
            "certificate_sha256": "$DKD_KEY_CERT_SHA256"
          }
          EOF_RUN
          git add .dkd_release/latest_aab_run.json
          git commit -m "ci: v$APP_VERSION AAB üretimini tamamla [skip ci]" || true
          git pull --rebase origin main
          git push origin main

      - name: Kalıcı imza eşleşmesini zorunlu tut
        if: always()
        shell: bash
        run: |
          test "${{ steps.signature.outputs.match }}" = "true"

