name: DraBornGate Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dkd_release/trigger_aab_v0313.txt

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: draborngate-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DKD_RELEASE_VAULT_URL: https://guuwomvszlwhkmstewfl.supabase.co/functions/v1/dkd-gate-release-vault
      DKD_SOURCE_RUN_ID: "30279086956"
      APP_VERSION: "0.3.13"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Supabase manifest run kimliğini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow=DraBornGate Release AAB"
            echo "mode=supabase-manifest-finalize"
            echo "version=0.3.13"
            echo "android_version_code=3"
          } > .dkd_release/latest_aab_run.txt
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .dkd_release/latest_aab_run.txt
          git commit -m "ci: v0.3.13 Supabase manifest run $GITHUB_RUN_ID kaydını güncelle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: GitHub OIDC release kimliğini al
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: İmzalı v0.3.13 AAB artifactini al
        uses: actions/download-artifact@v4
        with:
          name: DraBornGate-Release-AAB-v0.3.13
          path: release-artifact
          github-token: ${{ github.token }}
          repository: DrabornEagle/DraBornGate
          run-id: ${{ env.DKD_SOURCE_RUN_ID }}

      - name: Supabase istemcisini kur
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false @supabase/supabase-js@2.57.4

      - name: AAB manifestini oluştur ve Supabase'e yükle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release aab-parts
          REPORT=".dkd_release/dkd_supabase_aab_upload_latest.txt"
          AAB_PATH="$(find release-artifact -type f -name 'DraBornGate-v0.3.13-release.aab' -print -quit)"
          test -n "$AAB_PATH" && test -s "$AAB_PATH"
          split -b 4000000 -d -a 3 "$AAB_PATH" aab-parts/part-
          MANIFEST="DraBornGate-v${APP_VERSION}-release.aab.manifest.json"

          node - "$AAB_PATH" aab-parts "$MANIFEST" "$APP_VERSION" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const [aabPath, partsDir, manifestPath, version] = process.argv.slice(2);
          const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const parts = fs.readdirSync(partsDir).sort().map((name) => {
            const file = path.join(partsDir, name);
            return {
              name: `DraBornGate-v${version}-release.aab.${name}`,
              size: fs.statSync(file).size,
              sha256: digest(file),
            };
          });
          const manifest = {
            format: 'dkd-aab-parts-v1',
            version,
            androidVersionCode: 3,
            originalFile: `DraBornGate-v${version}-release.aab`,
            originalSize: fs.statSync(aabPath).size,
            originalSha256: digest(aabPath),
            partSizeBytes: 4000000,
            partCount: parts.length,
            storageFolder: `releases/v${version}/chunks`,
            parts,
            restore: 'Parçaları ad sırasıyla birleştir ve originalSha256 değerini doğrula.',
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
          NODE

          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"
          curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 \
            -H "$AUTH_HEADER" \
            "$DKD_RELEASE_VAULT_URL/release/aab-manifest-upload-url?version=${APP_VERSION}" \
            -o signed-manifest-upload.json
          node scripts/dkd_upload_signed_release_file.js "$MANIFEST" signed-manifest-upload.json application/json

          curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 \
            -H "$AUTH_HEADER" \
            "$DKD_RELEASE_VAULT_URL/release/aab-chunks?version=${APP_VERSION}" \
            -o aab-chunks-status.json
          test "$(jq '.objects | length' aab-chunks-status.json)" -eq 18
          test "$(jq '[.objects[] | select(.name == "manifest.json")] | length' aab-chunks-status.json)" -eq 1

          {
            echo "status=success"
            echo "run_id=$GITHUB_RUN_ID"
            jq -r '"version=" + .version, "original_file=" + .originalFile, "original_size=" + (.originalSize|tostring), "original_sha256=" + .originalSha256, "part_size=" + (.partSizeBytes|tostring), "part_count=" + (.partCount|tostring), "storage_folder=" + .storageFolder' "$MANIFEST"
            echo "storage_object_count=$(jq '.objects | length' aab-chunks-status.json)"
            echo "supabase_backup=success"
          } | tee "$REPORT"

          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "ci: v0.3.13 Supabase AAB manifestini doğrula $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Supabase AAB yükleme raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Supabase-AAB-Upload-v0.3.13
          path: |
            .dkd_release/dkd_supabase_aab_upload_latest.txt
            DraBornGate-v0.3.13-release.aab.manifest.json
            aab-chunks-status.json
          if-no-files-found: warn
          retention-days: 30
