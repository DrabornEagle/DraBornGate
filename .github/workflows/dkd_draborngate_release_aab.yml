name: DraBornGate Release AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dkd_release/trigger_aab_v0313.txt

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: draborngate-release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DKD_RELEASE_VAULT_URL: https://guuwomvszlwhkmstewfl.supabase.co/functions/v1/dkd-gate-release-vault
      DKD_SOURCE_RUN_ID: "30279086956"
      APP_VERSION: "0.3.13"

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Supabase yükleme run kimliğini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "source_sha=$GITHUB_SHA"
            echo "workflow=DraBornGate Release AAB"
            echo "mode=supabase-chunked-backup"
            echo "version=0.3.13"
            echo "android_version_code=3"
          } > .dkd_release/latest_aab_run.txt
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .dkd_release/latest_aab_run.txt
          git commit -m "ci: v0.3.13 Supabase parçalı AAB run $GITHUB_RUN_ID kaydını güncelle"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: GitHub OIDC release kimliğini al
        shell: bash
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=draborngate-release" | jq -r '.value')"
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          echo "DKD_RELEASE_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: İmzalı v0.3.13 AAB artifactini al
        uses: actions/download-artifact@v4
        with:
          name: DraBornGate-Release-AAB-v0.3.13
          path: release-artifact
          github-token: ${{ github.token }}
          repository: DrabornEagle/DraBornGate
          run-id: ${{ env.DKD_SOURCE_RUN_ID }}

      - name: Supabase istemcisini kur
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false @supabase/supabase-js@2.57.4

      - name: AAB'yi 4.000.000 baytlık parçalarla Supabase Storage'a yedekle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release release-chunks signed-uploads
          REPORT=".dkd_release/dkd_supabase_aab_upload_latest.txt"
          : > "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1

          AAB_PATH="$(find release-artifact -type f -name 'DraBornGate-v0.3.13-release.aab' -print -quit)"
          test -n "$AAB_PATH" && test -s "$AAB_PATH"
          AAB_SIZE="$(stat -c '%s' "$AAB_PATH")"
          AAB_SHA256="$(sha256sum "$AAB_PATH" | awk '{print $1}')"
          echo "AAB=$AAB_PATH"
          echo "size=$AAB_SIZE"
          echo "sha256=$AAB_SHA256"

          split -b 4000000 -d -a 3 "$AAB_PATH" release-chunks/part-
          PARTS_JSON='[]'
          PART_COUNT=0
          AUTH_HEADER="Authorization: Bearer $DKD_RELEASE_OIDC_TOKEN"

          for DKD_CHUNK in release-chunks/part-*; do
            DKD_PART="$(basename "$DKD_CHUNK")"
            DKD_PART_SIZE="$(stat -c '%s' "$DKD_CHUNK")"
            DKD_PART_SHA="$(sha256sum "$DKD_CHUNK" | awk '{print $1}')"
            DKD_SIGNED_JSON="signed-uploads/${DKD_PART}.json"
            curl --fail-with-body --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 \
              -H "$AUTH_HEADER" \
              "$DKD_RELEASE_VAULT_URL/release/aab-part-upload-url?version=${APP_VERSION}&part=${DKD_PART}" \
              -o "$DKD_SIGNED_JSON"
            node scripts/dkd_upload_signed_release_file.js "$DKD_CHUNK" "$DKD_SIGNED_JSON" application/octet-stream
            PARTS_JSON="$(jq --arg name "$DKD_PART" --argjson size "$DKD_PART_SIZE" --arg sha256 "$DKD_PART_SHA" '. + [{name:$name,size:$size,sha256:$sha256}]' <<< "$PARTS_JSON")"
            PART_COUNT=$((PART_COUNT + 1))
          done

          jq -n \
            --arg version "$APP_VERSION" \
            --arg file "DraBornGate-v${APP_VERSION}-release.aab" \
            --arg sha256 "$AAB_SHA256" \
            --argjson size "$AAB_SIZE" \
            --argjson chunkSize 4000000 \
            --argjson partCount "$PART_COUNT" \
            --argjson parts "$PARTS_JSON" \
            '{format:"dkd-aab-chunks-v1",version:$version,file:$file,size:$size,sha256:$sha256,chunkSize:$chunkSize,partCount:$partCount,parts:$parts,reconstruct:"cat part-* > DraBornGate-v0.3.13-release.aab"}' \
            > release-chunks/manifest.json

          curl --fail-with-body --show-error --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 \
            -H "$AUTH_HEADER" \
            "$DKD_RELEASE_VAULT_URL/release/aab-manifest-upload-url?version=${APP_VERSION}" \
            -o signed-uploads/manifest.json
          node scripts/dkd_upload_signed_release_file.js release-chunks/manifest.json signed-uploads/manifest.json application/json

          curl --fail-with-body --show-error --location --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            -H "$AUTH_HEADER" \
            "$DKD_RELEASE_VAULT_URL/release/aab-chunks?version=${APP_VERSION}" \
            -o release-chunks/remote-list.json
          REMOTE_COUNT="$(jq '[.objects[] | select(.name | startswith("DraBornGate-v0.3.13-release.aab.part-"))] | length' release-chunks/remote-list.json)"
          test "$REMOTE_COUNT" -eq "$PART_COUNT"
          jq -e '.objects[] | select(.name == "manifest.json")' release-chunks/remote-list.json >/dev/null

          echo "part_count=$PART_COUNT"
          echo "remote_part_count=$REMOTE_COUNT"
          echo "supabase_backup=success"

          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "ci: v0.3.13 Supabase parçalı AAB yedeğini doğrula $GITHUB_RUN_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Supabase AAB yükleme raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Supabase-AAB-Upload-v0.3.13
          path: |
            .dkd_release/dkd_supabase_aab_upload_latest.txt
            release-chunks/manifest.json
            release-chunks/remote-list.json
          if-no-files-found: warn
          retention-days: 30
