name: DraBornGate Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '.dkd_release/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draborngate-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: draborngate-upload
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: APK çalışma kimliğini kaydet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dkd_release
          cat > .dkd_release/latest_apk_run.json <<EOF_RUN
          {
            "version": "0.3.7",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "source_sha": "${{ github.sha }}",
            "artifact_name": "DraBornGate-Release-APK-v0.3.7"
          }
          EOF_RUN
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .dkd_release/latest_apk_run.json
          git commit -m "ci: v0.3.7 APK çalışma kimliğini kaydet [skip ci]" || exit 0
          git push
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Release sırlarını doğrula
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "ANDROID_KEYSTORE_BASE64 eksik"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD eksik"; exit 1; }
          test -n "$GOOGLE_MAPS_ANDROID_API_KEY" || { echo "GOOGLE_MAPS_ANDROID_API_KEY eksik"; exit 1; }
          test -f google-services.json || { echo "google-services.json eksik"; exit 1; }
      - name: Bağımlılıkları kur ve doğrula
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Android release projesini üret
        run: npx expo prebuild --clean --platform android
      - name: İmzalama anahtarını hazırla
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/draborngate-release.keystore
          cat >> "$HOME/.gradle/gradle.properties" <<EOF_GRADLE
          DKD_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/android/app/draborngate-release.keystore
          DKD_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          DKD_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          DKD_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF_GRADLE
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let src = fs.readFileSync(file, 'utf8');
          const marker = /signingConfigs\s*\{([\s\S]*?)\n\s{4}\}/;
          if (!marker.test(src)) throw new Error('signingConfigs bloğu bulunamadı');
          src = src.replace(marker, (block) => block.replace(/\n\s{4}\}$/, `\n        release {\n            storeFile file(findProperty('DKD_UPLOAD_STORE_FILE'))\n            storePassword findProperty('DKD_UPLOAD_STORE_PASSWORD')\n            keyAlias findProperty('DKD_UPLOAD_KEY_ALIAS')\n            keyPassword findProperty('DKD_UPLOAD_KEY_PASSWORD')\n        }\n    }`));
          src = src.replace(/(release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug/, '$1signingConfig signingConfigs.release');
          fs.writeFileSync(file, src);
          NODE
      - name: Release APK oluştur
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK adını düzenle
        run: cp android/app/build/outputs/apk/release/app-release.apk DraBornGate-v0.3.7-release.apk
      - name: DraBornGate Release APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Release-APK-v0.3.7
          path: DraBornGate-v0.3.7-release.apk
          if-no-files-found: error
          retention-days: 14
