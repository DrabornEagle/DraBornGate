name: DraBornGate v0.3.7 Source Sync

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draborngate-v0-3-7-source-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Çalışma dalını al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: v0.3.7 kaynak paketini doğrula ve uygula
        shell: bash
        run: |
          set -euo pipefail
          cat .dkd_payload/part_* | base64 --decode > /tmp/draborngate-v0.3.7.tar.gz
          echo "963b544d5fdf43a27dce606575d07f36dd2addfe0506e1b7199f2d8b7351b269  /tmp/draborngate-v0.3.7.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf /tmp/draborngate-v0.3.7.tar.gz -C "$GITHUB_WORKSPACE"
          sed -i 's/StyleSheet\.absoluteFillObject/StyleSheet.absoluteFill/g' src/components/TimestampedPrivateImage.tsx
          rm -rf .dkd_payload
          rm -f \
            .github/workflows/android-apk.yml \
            .github/workflows/dkd_temp_source_export.yml \
            .github/workflows/dkd_validate_v0_3_2.yml \
            .github/workflows/quality-check.yml \
            .github/workflows/v0-2-validate.yml
          chmod +x scripts/dkd_update_v0_3_7_termux.sh

      - name: Workflow temizliğini doğrula
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)
          printf '%s\n' "${workflows[@]}"
          test "${#workflows[@]}" -eq 2
          test "${workflows[0]}" = "dkd_draborngate_release_aab.yml"
          test "${workflows[1]}" = "dkd_draborngate_release_apk.yml"

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: TypeScript doğrula
        run: npm run typecheck

      - name: Sürüm ve kapsam doğrulaması
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const app = require('./app.json').expo;
          const expected = '0.3.7';
          const version = fs.readFileSync('./src/config/version.ts', 'utf8');
          if (pkg.version !== expected || app.version !== expected || app.extra?.appVersion !== expected || app.extra?.demoDataVersion !== expected) throw new Error('v0.3.7 sürüm eşleşmesi bozuk');
          if (app.android.versionCode !== 1 || !version.includes("ANDROID_VERSION_CODE = 1")) throw new Error('Android versionCode 1 değil');
          for (const [file, tokens] of Object.entries({
            './src/components/TimestampedPrivateImage.tsx': ['react-native-safe-area-context', 'Animated.loop', 'StyleSheet.absoluteFill'],
            './src/components/DkdNotificationCenter.tsx': ['TÜMÜNÜ TEMİZLE', 'DAHA FAZLA'],
            './src/components/PassCard.tsx': ['GEÇİŞ KODU', 'KODU EŞLEŞTİR'],
            './src/screens/SecurityHome.tsx': ['Eşleşme Gerçekleşti', 'Kurye Geliyor'],
            './src/screens/CourierCenterV032.tsx': ['hasCourierPackage', 'attention'],
            './supabase/migrations/20260725223000_draborngate_v0_3_7_security_code_notifications.sql': ['dkd_gate_clear_notifications', 'dkd_gate_mark_all_notifications_read']
          })) {
            const source = fs.readFileSync(file, 'utf8');
            for (const token of tokens) if (!source.includes(token)) throw new Error(`${file} token eksik: ${token}`);
          }
          console.log('DraBornGate v0.3.7 kapsamı doğrulandı.');
          NODE

      - name: v0.3.7 kaynaklarını çalışma dalına işle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "DraBornGate v0.3.7 güvenlik ve bildirim düzeltmeleri"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
