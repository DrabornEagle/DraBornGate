name: DraBornGate Temporary Source Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4
      - name: Kaynak arşivini hazırla
        run: |
          zip -r DraBornGate-source.zip . -x '.git/*' -x 'node_modules/*' -x 'android/*' -x 'dist/*'
      - name: Kaynak arşivini yükle
        uses: actions/upload-artifact@v4
        with:
          name: DraBornGate-Source-Export
          path: DraBornGate-source.zip
          if-no-files-found: error
          retention-days: 1
