name: DraBornGate v0.3.8 Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v038_migrate.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: dkd-v038-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Marka görsellerini tam çözünürlükte al
        shell: bash
        env:
          ICON_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/b212a8f2-82ad-48d6-be68-7cffe141d73b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTRhZjM1M2I0YmY2MDc4NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NTIwNjA3NX0.0vP8NYwIEDM7d_9tGOSWbGSEdgXRw6HEoj9-7NJKgu8"
          WELCOME_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/4a1bf1ba-73e4-4d11-a1ce-44b217527492.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODFhYjRhZjM4ZjU0MmFjNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NTIxNzkwN30.AIg6eww_3rwDbgxStL8xzSGLAAJS7NUd5E4_h0GPxK4"
        run: |
          set -euo pipefail
          mkdir -p assets/branding /tmp/dkd-branding
          curl -fL --retry 3 --connect-timeout 20 "$ICON_URL" -o /tmp/dkd-branding/draborngate-app-icon.source
          curl -fL --retry 3 --connect-timeout 20 "$WELCOME_URL" -o /tmp/dkd-branding/draborngate-welcome.source
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = {
              Path('/tmp/dkd-branding/draborngate-app-icon.source'): (
                  Path('assets/branding/draborngate-app-icon.png'),
                  (1536, 1536),
              ),
              Path('/tmp/dkd-branding/draborngate-welcome.source'): (
                  Path('assets/branding/draborngate-welcome.png'),
                  (864, 1536),
              ),
          }

          for source, (target, expected_size) in assets.items():
              with Image.open(source) as image:
                  image.load()
                  print(source.name, image.format, image.size, image.mode, source.stat().st_size)
                  if image.size != expected_size:
                      raise SystemExit(f'{source} beklenen boyutta değil: {image.size}')
                  image.convert('RGB').save(target, format='PNG', compress_level=6)
              with Image.open(target) as verified:
                  verified.load()
                  if verified.format != 'PNG' or verified.size != expected_size:
                      raise SystemExit(f'{target} PNG doğrulaması başarısız')
                  print(target, verified.format, verified.size, target.stat().st_size)
          PY

      - name: v0.3.8 dönüşüm scriptini aç
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.dkd_v038_script/part-* | base64 -d | gzip -d > scripts/dkd_apply_v038.py
          python -m py_compile scripts/dkd_apply_v038.py

      - name: v0.3.8 değişikliklerini uygula
        run: python scripts/dkd_apply_v038.py

      - name: TypeScript 6 uyumluluk düzeltmeleri
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          picker = Path('src/components/SiteLocationPicker.tsx')
          picker_text = picker.read_text(encoding='utf-8')
          old_picker = '...StyleSheet.absoluteFillObject'
          if old_picker not in picker_text:
              raise SystemExit('SiteLocationPicker absoluteFillObject kalıbı bulunamadı')
          picker.write_text(picker_text.replace(old_picker, '...StyleSheet.absoluteFill', 1), encoding='utf-8')

          courier = Path('src/screens/CourierHome.tsx')
          courier_text = courier.read_text(encoding='utf-8')
          old_courier = 'const promptedPass = useRef<string>();'
          if old_courier not in courier_text:
              raise SystemExit('CourierHome useRef kalıbı bulunamadı')
          courier.write_text(courier_text.replace(old_courier, 'const promptedPass = useRef<string | undefined>(undefined);', 1), encoding='utf-8')
          PY

      - name: Geçici dosyaları temizle ve sürüm prosedürünü düzelt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ .dkd_release/v038-assets
          python - <<'PY'
          from pathlib import Path
          release_doc = Path('docs/RELEASE_PROCESS.md')
          release_text = release_doc.read_text(encoding='utf-8')
          release_text = release_text.replace(
              '4. Android `versionCode`, APK hedef sürümüne kadar `1` kalır.',
              '4. Android `versionCode` her Google Play sürümünde artırılır; DraBornGate v0.3.8 için değer `2`dir.',
          )
          release_doc.write_text(release_text, encoding='utf-8')
          PY

      - name: Bağımlılık ve tip kontrolü
        id: dkd_validation
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > dkd_npm_install_v038.log 2>&1
          dkd_install_status=$?
          dkd_typecheck_status=99
          dkd_expo_status=99
          if [ "$dkd_install_status" -eq 0 ]; then
            npm run typecheck > dkd_typecheck_v038.log 2>&1
            dkd_typecheck_status=$?
          else
            printf 'Tip kontrolü npm install başarısız olduğu için çalıştırılmadı.\n' > dkd_typecheck_v038.log
          fi
          if [ "$dkd_install_status" -eq 0 ] && [ "$dkd_typecheck_status" -eq 0 ]; then
            npx expo config --type public > dkd_expo_config_v038.log 2>&1
            dkd_expo_status=$?
          else
            printf 'Expo config önceki kontrol başarısız olduğu için çalıştırılmadı.\n' > dkd_expo_config_v038.log
          fi
          set -e
          printf 'install=%s\ntypecheck=%s\nexpo=%s\n' "$dkd_install_status" "$dkd_typecheck_status" "$dkd_expo_status" > dkd_validation_status_v038.log
          if [ "$dkd_install_status" -ne 0 ] || [ "$dkd_typecheck_status" -ne 0 ] || [ "$dkd_expo_status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          zip -qr dkd_v038_migrated_source.zip . \
            -x '.git/*' 'node_modules/*' 'dkd_v038_migrated_source.zip'

      - name: Tanı ve uygulanmış kaynak artifactını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dkd-v038-diagnostics-${{ github.run_id }}
          path: |
            dkd_npm_install_v038.log
            dkd_typecheck_v038.log
            dkd_expo_config_v038.log
            dkd_validation_status_v038.log
            dkd_v038_migrated_source.zip
          if-no-files-found: error
          retention-days: 3

      - name: Kontrol başarısızsa durdur
        if: steps.dkd_validation.outputs.failed == 'true'
        run: |
          cat dkd_validation_status_v038.log
          cat dkd_typecheck_v038.log
          exit 1

      - name: Geçici tanı dosyalarını temizle
        if: steps.dkd_validation.outputs.failed == 'false'
        run: rm -f dkd_npm_install_v038.log dkd_typecheck_v038.log dkd_expo_config_v038.log dkd_validation_status_v038.log dkd_v038_migrated_source.zip

      - name: v0.3.8 ana repoya yaz
        if: steps.dkd_validation.outputs.failed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
          git commit -m "DraBornGate v0.3.8 UI, harita ve release güncellemesi [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: APK ve AAB release workflowlarını başlat
        if: steps.dkd_validation.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          for workflow in dkd_draborngate_release_apk.yml dkd_draborngate_release_aab.yml; do
            curl -fL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}'
          done

# dkd-trigger-v038-12
