name: DraBornGate v0.3.8 Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd_v038_migrate.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: dkd-v038-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Marka görsellerini tam çözünürlükte al
        shell: bash
        env:
          ICON_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/b212a8f2-82ad-48d6-be68-7cffe141d73b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTRhZjM1M2I0YmY2MDc4NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NTIwNjA3NX0.0vP8NYwIEDM7d_9tGOSWbGSEdgXRw6HEoj9-7NJKgu8"
          WELCOME_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/4a1bf1ba-73e4-4d11-a1ce-44b217527492.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODFhYjRhZjM4ZjU0MmFjNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4NTIxNzkwN30.AIg6eww_3rwDbgxStL8xzSGLAAJS7NUd5E4_h0GPxK4"
        run: |
          set -euo pipefail
          mkdir -p assets/branding /tmp/dkd-branding
          curl -fL --retry 3 --connect-timeout 20 "$ICON_URL" -o /tmp/dkd-branding/draborngate-app-icon.source
          curl -fL --retry 3 --connect-timeout 20 "$WELCOME_URL" -o /tmp/dkd-branding/draborngate-welcome.source
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = {
              Path('/tmp/dkd-branding/draborngate-app-icon.source'): (
                  Path('assets/branding/draborngate-app-icon.png'),
                  (1536, 1536),
              ),
              Path('/tmp/dkd-branding/draborngate-welcome.source'): (
                  Path('assets/branding/draborngate-welcome.png'),
                  (864, 1536),
              ),
          }

          for source, (target, expected_size) in assets.items():
              with Image.open(source) as image:
                  image.load()
                  print(source.name, image.format, image.size, image.mode, source.stat().st_size)
                  if image.size != expected_size:
                      raise SystemExit(f'{source} beklenen boyutta değil: {image.size}')
                  image.convert('RGB').save(target, format='PNG', compress_level=6)
              with Image.open(target) as verified:
                  verified.load()
                  if verified.format != 'PNG' or verified.size != expected_size:
                      raise SystemExit(f'{target} PNG doğrulaması başarısız')
                  print(target, verified.format, verified.size, target.stat().st_size)
          PY

      - name: v0.3.8 dönüşüm scriptini aç
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.dkd_v038_script/part-* | base64 -d | gzip -d > scripts/dkd_apply_v038.py
          python -m py_compile scripts/dkd_apply_v038.py

      - name: v0.3.8 değişikliklerini uygula
        run: python scripts/dkd_apply_v038.py

      - name: Bağımlılık ve tip kontrolü
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npx expo config --type public > /tmp/expo-config.json

      - name: v0.3.8 ana repoya yaz
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DraBornGate Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "DraBornGate v0.3.8 UI, harita ve release güncellemesi [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: APK ve AAB release workflowlarını başlat
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          for workflow in dkd_draborngate_release_apk.yml dkd_draborngate_release_aab.yml; do
            curl -fL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" \
              -d '{"ref":"main"}'
          done

