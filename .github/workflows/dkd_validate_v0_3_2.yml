name: DraBornGate v0.3.4 Validate

on:
  push:
    branches: [main, release/v0.3.4]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draborngate-v0-3-4-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: TypeScript tanılaması
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee dkd_typecheck_v0_3_4.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: TypeScript raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dkd-typecheck-v0-3-4
          path: dkd_typecheck_v0_3_4.log
          if-no-files-found: error
          retention-days: 7
      - name: TypeScript sonucunu doğrula
        run: |
          cat dkd_typecheck_v0_3_4.log
          test "${{ steps.typecheck.outputs.exit_code }}" = "0"
      - name: Android Expo dışa aktarma testi
        run: npx expo export --platform android --output-dir dist --max-workers 2 --no-bytecode
      - name: Native Android yapılandırmasını üret
        id: prebuild
        shell: bash
        env:
          CI: "1"
          GOOGLE_MAPS_ANDROID_API_KEY: dkd_validation_placeholder_key
        run: |
          set +e
          npx expo prebuild --clean --platform android 2>&1 | tee dkd_native_prebuild_v0_3_4.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Native prebuild raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dkd-native-prebuild-v0-3-4
          path: dkd_native_prebuild_v0_3_4.log
          if-no-files-found: error
          retention-days: 7
      - name: Native prebuild sonucunu doğrula
        run: |
          cat dkd_native_prebuild_v0_3_4.log
          test "${{ steps.prebuild.outputs.exit_code }}" = "0"
      - name: Native proje çıktısını doğrula
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/app/google-services.json
          grep -R "com.draborneagle.draborngate" android/app/build.gradle android/app/src/main/AndroidManifest.xml
      - name: Sürüm ve v0.3.4 kapsam doğrulaması
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const app = require('./app.json').expo;
          const expected = '0.3.4';
          const version = fs.readFileSync('./src/config/version.ts','utf8');
          if(pkg.version!==expected||app.version!==expected||app.extra?.appVersion!==expected||app.extra?.demoDataVersion!==expected) throw new Error('v0.3.4 sürüm eşleşmesi bozuk');
          if(app.android.versionCode!==1||!version.includes("ANDROID_VERSION_CODE = 1")) throw new Error('Android versionCode 1 değil');
          if(app.android.googleServicesFile!=='./google-services.json'||!fs.existsSync('./google-services.json')) throw new Error('Firebase Android yapılandırması eksik');
          console.log('Sürüm alanları doğrulandı.');
          NODE
          grep -Fq "toLocaleString('tr-TR'" src/components/TimestampedPrivateImage.tsx
          grep -Fq "imageFullscreen" src/screens/SecurityHome.tsx
          grep -Fq "dkd_gate_lookup_courier_by_code" src/screens/SecurityHome.tsx
          grep -Fq "setLimit((value) => value + 5)" src/screens/PassesScreen.tsx
          grep -Fq "setLimit((value) => value + 6)" src/screens/HistoryScreen.tsx
          grep -Fq "dkd_gate_get_site_entry_report" src/screens/ManagementProCenter.tsx
          grep -Fq "getDevicePushTokenAsync" src/lib/notifications.ts
          grep -Fq "dkd_gate_get_firebase_service_account_json" supabase/migrations/20260725163500_draborngate_v0_3_4_push_compat.sql
          grep -Fq "dkd_gate_notifications_push_dispatch_trg" supabase/migrations/20260725164000_draborngate_v0_3_4_push_dispatch_trigger.sql
          if git ls-files | grep -Eqi 'firebase-adminsdk|service[-_]?account.*\.json$'; then
            echo 'Firebase Admin servis hesabı dosyası repoya eklenemez.' >&2
            exit 1
          fi
          echo 'DraBornGate v0.3.4 kapsamı ve Android versionCode 1 doğrulandı.'